# Use from another repo:
#   - repo: https://github.com/maxmccutcheon59/watchwire
#     rev: v0.5.0   # or a commit SHA
#     hooks:
#       - id: watchwire-scan
#
# Scans staged/pass_filenames paths locally; exits 1 on findings.
- id: watchwire-scan
  name: watchwire scan
  description: Local-first secret leak scan (regex + entropy); fails on findings
  entry: watchwire scan
  language: python
  types: [text]
  pass_filenames: true
